<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案例</title>
    <style>
        div {
            color: aquamarine;
        }
    </style>
</head>
<body>

    <div id="div1">用户注册</div>
    <table>
        <tr>
            <td>用户名：</td>
            <td><input type="text" placeholder="请输入用户名"></td>

    <div>

    </div>
