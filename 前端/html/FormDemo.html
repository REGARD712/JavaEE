<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单练习页面</title>
</head>
<body>
    <form action="test.html" method="get">  
        用户名： <input type="text" name="username"><br>
        密码： <input type="password" name="password"><br>
        性别： <input type="radio" name="gender" id="male" value="1"> <label for="male">男</label>
            <input type="radio" name="gender" id="female" value="2"> <label for="female">女</label>
            <input type="radio" name="gender" id="secret" value="0"> <label for="secret">保密</label><br>
        爱好： <input type="checkbox" name="hobby" id="reading" value="1">
            <label for="reading">阅读</label>
            <input type="checkbox" name="hobby" id="traveling" value="2">
            <label for="traveling">旅行</label>
            <input type="checkbox" name="hobby" id="sports" value="3">
            <label for="sports">运动</label><br>
        专业： <select name="major">
            <option value="cs">计算机科学</option>
            <option value="math">数学</option>
            <option value="physics" selected>物理</option><br>
        </select><br>
        个人描述： <textarea> </textarea>
        <!-- <button>提交</button>
        <input type="button" value="重置"> -->
        <input type="submit" value="提交表单">
    </form>
</body>
</html>
